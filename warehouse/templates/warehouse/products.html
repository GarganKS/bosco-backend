{% extends "base.html" %} {% load warehouse_extras %} {% block content %}
<table>
    <thead>
        <tr>
            <th>Назва</th>
            <th>Категорія</th>
            <th>Матеріал</th>
            <th>Бренд</th>
            <th>Ціна</th>
        </tr>
    </thead>
    <tbody>
        {% for p in product_list %}
        <tr>
            <td>{{p.name}}</td>
            <td>{{p.category}}</td>
            <td>{{p.material}}</td>
            <td>{{p.brand}}</td>
            <td>{{p.price}}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5">No products</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
